<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 388" width="490" height="388" role="img" aria-label="Avni Jain — now, prev, stack, highlights">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .k { fill: #39d353; font-weight: 700; }
    .v { fill: #c9d1d9; }
    .d { fill: #8b949e; }
    .u { fill: #58a6ff; font-weight: 700; }
    .t { fill: #8b949e; font-size: 12px; }
    .row { opacity: 0; animation: in 0.45s ease-out forwards; }
    @keyframes in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .r1 { animation-delay: 0.2s; }
    .r2 { animation-delay: 0.5s; }
    .r3 { animation-delay: 0.8s; }
    .r4 { animation-delay: 1.1s; }
    .r5 { animation-delay: 1.4s; }
    .r6 { animation-delay: 1.7s; }
    .r7 { animation-delay: 2.0s; }
    .r8 { animation-delay: 2.3s; }
    .r9 { animation-delay: 2.7s; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="488" height="386" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M1.75 11 a9.25 9.25 0 0 1 9.25 -9.25 h468 a9.25 9.25 0 0 1 9.25 9.25 v25 h-486.5 z" fill="#161b22"/>
  <line x1="1.75" y1="36" x2="488.25" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="22" cy="19" r="5.5" fill="#ff5f56"/>
  <circle cx="41" cy="19" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="19" r="5.5" fill="#27c93f"/>
  <text x="245" y="23" text-anchor="middle" class="t">avni@github: ~</text>

  <!-- content -->
  <g class="row r1">
    <text x="24" y="70"><tspan class="k">$</tspan><tspan class="v"> neofetch</tspan></text>
  </g>

  <g class="row r2">
    <text x="24" y="106"><tspan class="u">avni</tspan><tspan class="d">@</tspan><tspan class="u">github</tspan></text>
    <text x="24" y="124" class="d">-----------</text>
  </g>

  <g class="row r3">
    <text x="24" y="156" class="k">Name</text>
    <text x="140" y="156" class="v">Avni Jain</text>
  </g>

  <g class="row r4">
    <text x="24" y="186" class="k">Now</text>
    <text x="140" y="186" class="v">B.Tech CSE (AI) · 3rd year</text>
  </g>

  <g class="row r5">
    <text x="24" y="216" class="k">Prev</text>
    <text x="140" y="216" class="v">Certifications · GitHub projects</text>
  </g>

  <g class="row r6">
    <text x="24" y="246" class="k">Stack</text>
    <text x="140" y="246" class="v">Python · SQL · Excel</text>
  </g>

  <g class="row r7">
    <text x="24" y="276" class="k">Highlights</text>
    <text x="140" y="276" class="v">Selected for SIH 2026</text>
  </g>

  <g class="row r8">
    <text x="140" y="298" class="d">final round result awaited</text>
  </g>

  <!-- palette blocks -->
  <g class="row r9">
    <rect x="24"  y="330" width="28" height="18" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <rect x="56"  y="330" width="28" height="18" rx="3" fill="#0e4429"/>
    <rect x="88"  y="330" width="28" height="18" rx="3" fill="#006d32"/>
    <rect x="120" y="330" width="28" height="18" rx="3" fill="#26a641"/>
    <rect x="152" y="330" width="28" height="18" rx="3" fill="#39d353"/>
    <rect x="184" y="330" width="28" height="18" rx="3" fill="#69f0a0"/>
    <rect x="216" y="330" width="28" height="18" rx="3" fill="#58a6ff"/>
    <rect x="248" y="330" width="28" height="18" rx="3" fill="#c9d1d9"/>
  </g>
